[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-native-cx-platform"
version = "0.2.0"
description = "Reference commerce business backend for an AI-native customer service platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "enterprise-agent-harness @ git+https://github.com/etimbukafia/enterprise-agent-harness.git@c506366d3db69d7c6fff20cfc5c4e53c93ceb9c7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_business", "cx_platform"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: opt-in external service smoke tests",
]
